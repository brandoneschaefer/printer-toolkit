# Render blueprint for the Printer Toolkit control plane.
# Deploy: push to GitHub, then in Render choose "New +" -> "Blueprint" and point
# it at this repo. Render provisions the web service and the Postgres database,
# wires DATABASE_URL automatically, and runs migrations on every deploy.
#
# Secrets to set in the Render dashboard after the first deploy (sync:false):
#   AUTH_SECRET, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
#   STRIPE_PRICE_ONE_TIME_AUDIT, STRIPE_PRICE_SUBSCRIPTION_MONTHLY,
#   NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
# And set APP_URL to the service's public URL, and BILLING_MOCK_MODE=false.

databases:
  - name: sentinelprint-db
    databaseName: sentinelprint
    user: sentinel
    plan: basic-256mb

services:
  # Redis / Key Value store backing the BullMQ scan queue.
  - type: redis
    name: sentinelprint-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: [] # only reachable from this Render private network

  # Web control plane (UI, API, billing).
  - type: web
    name: printertoolkit
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    # Wait for the database to be reachable (new Postgres can take a few minutes
    # to accept connections), run migrations, then start the server.
    startCommand: |
      bash -c '
      for i in $(seq 1 24); do
        npx prisma migrate deploy && exec npm run start
        echo "database not ready, retry $i/24"; sleep 10
      done
      echo "database unreachable after retries"; exit 1
      '
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinelprint-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sentinelprint-redis
          type: redis
          property: connectionString
      - key: NODE_VERSION
        value: "22"
      - key: BILLING_MOCK_MODE
        value: "false"
      - key: SCANNER_MAX_HOSTS
        value: "256"
      - key: SCANNER_TCP_TIMEOUT_MS
        value: "2500"
      # Generated once by Render and kept stable across deploys.
      - key: AUTH_SECRET
        generateValue: true
      # Set these in the dashboard (kept out of git).
      - key: APP_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ONE_TIME_AUDIT
        sync: false
      - key: STRIPE_PRICE_SUBSCRIPTION_MONTHLY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false

  # Background worker: runs cloud scans off the queue + fires scheduled re-scans.
  - type: worker
    name: sentinelprint-worker
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate
    startCommand: npm run worker
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinelprint-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sentinelprint-redis
          type: redis
          property: connectionString
      - key: NODE_VERSION
        value: "22"
      - key: SCANNER_MAX_HOSTS
        value: "256"
      - key: SCANNER_TCP_TIMEOUT_MS
        value: "2500"
      - key: SCHEDULER_TICK_MS
        value: "60000"
