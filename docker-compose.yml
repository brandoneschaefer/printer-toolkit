services:
  db:
    image: postgres:16-alpine
    container_name: sentinelprint-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinelprint
    ports:
      - "5432:5432"
    volumes:
      - sentinel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelprint"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sentinel_pgdata:
