name: Bundle collector

# Keeps dist/collector.cjs (the single-file agent the Windows installer
# downloads) in sync whenever the agent or scan engine changes.

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "src/lib/scanner/**"
      - "package.json"
  workflow_dispatch: {}

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build:collector
      - name: Commit refreshed bundle if changed
        run: |
          if ! git diff --quiet -- dist/collector.cjs; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add dist/collector.cjs
            git commit -m "chore: rebuild collector bundle [skip ci]"
            git push
          else
            echo "bundle unchanged"
          fi
